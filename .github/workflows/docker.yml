# Baut den Container für den Live-Betrieb (Dockerfile) und prüft ihn kurz.
# Auf main und bei Versions-Tags (v*) wird das Image für linux/amd64 und linux/arm64 nach ghcr.io/<owner>/<repo> geschoben; auf anderen Zweigen und in Pull Requests nur gebaut.
name: Docker

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3          # für linux/arm64 (Raspberry Pi, NAS, Apple Silicon)

      - uses: docker/setup-buildx-action@v3

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Bauen (zum Prüfen laden)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hobbyflood:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Kurzprüfung im Container
        run: |
          docker run --rm hobbyflood:test python -c "import routing, lateral, chain_fc, uncert, live; print('Module ok')"
          docker run --rm hobbyflood:test python -c "import routing; assert routing._load_lib(); print('C-Rechenkern ok')"
          docker run --rm hobbyflood:test python test_rain.py
          docker run --rm hobbyflood:test sh -n deploy/run_live.sh

      - name: Anmelden bei ghcr.io
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image schieben
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
